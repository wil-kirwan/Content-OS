openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Content OS API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: health
    description: Health operations
  - name: workspaces
    description: Workspace management
  - name: integrations
    description: HighLevel integration management
  - name: campaigns
    description: Campaign management
  - name: planner-items
    description: Planner item management
  - name: templates
    description: Template management
  - name: dashboard
    description: Dashboard and analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Workspace
  /workspaces:
    get:
      operationId: getWorkspaces
      tags: [workspaces]
      summary: List workspaces
      responses:
        "200":
          description: List of workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Create workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceBody"
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"

  /workspaces/{id}:
    get:
      operationId: getWorkspace
      tags: [workspaces]
      summary: Get workspace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
    patch:
      operationId: updateWorkspace
      tags: [workspaces]
      summary: Update workspace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceBody"
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"

  # Integrations
  /workspaces/{workspaceId}/integrations:
    get:
      operationId: getIntegrations
      tags: [integrations]
      summary: List integrations for workspace
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of integrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Integration"
    post:
      operationId: createIntegration
      tags: [integrations]
      summary: Create or update HighLevel integration
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIntegrationBody"
      responses:
        "201":
          description: Integration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"

  /workspaces/{workspaceId}/integrations/{id}:
    get:
      operationId: getIntegration
      tags: [integrations]
      summary: Get integration
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
    patch:
      operationId: updateIntegration
      tags: [integrations]
      summary: Update integration (e.g. rotate token)
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIntegrationBody"
      responses:
        "200":
          description: Updated integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
    delete:
      operationId: deleteIntegration
      tags: [integrations]
      summary: Delete integration
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /workspaces/{workspaceId}/integrations/{id}/validate:
    post:
      operationId: validateIntegration
      tags: [integrations]
      summary: Validate HighLevel connection
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"

  /workspaces/{workspaceId}/integrations/{id}/sync:
    post:
      operationId: syncIntegration
      tags: [integrations]
      summary: Trigger HighLevel sync
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  # Campaigns
  /workspaces/{workspaceId}/campaigns:
    get:
      operationId: getCampaigns
      tags: [campaigns]
      summary: List campaigns
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create campaign
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignBody"
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /workspaces/{workspaceId}/campaigns/{id}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Get campaign
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update campaign
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCampaignBody"
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete campaign
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  # Planner Items
  /workspaces/{workspaceId}/planner-items:
    get:
      operationId: getPlannerItems
      tags: [planner-items]
      summary: List planner items
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: string
          description: "YYYY-MM format"
        - name: campaignId
          in: query
          schema:
            type: ["integer", "null"]
        - name: laneGroup
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: approvalStatus
          in: query
          schema:
            type: string
        - name: ownerId
          in: query
          schema:
            type: ["integer", "null"]
        - name: syncStatus
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of planner items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlannerItem"
    post:
      operationId: createPlannerItem
      tags: [planner-items]
      summary: Create planner item
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlannerItemBody"
      responses:
        "201":
          description: Planner item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerItem"

  /workspaces/{workspaceId}/planner-items/{id}:
    get:
      operationId: getPlannerItem
      tags: [planner-items]
      summary: Get planner item
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Planner item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerItem"
    patch:
      operationId: updatePlannerItem
      tags: [planner-items]
      summary: Update planner item
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlannerItemBody"
      responses:
        "200":
          description: Updated planner item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerItem"
    delete:
      operationId: deletePlannerItem
      tags: [planner-items]
      summary: Delete planner item
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /workspaces/{workspaceId}/planner-items/{id}/duplicate:
    post:
      operationId: duplicatePlannerItem
      tags: [planner-items]
      summary: Duplicate planner item
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Duplicated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerItem"

  /workspaces/{workspaceId}/planner-items/{id}/push:
    post:
      operationId: pushPlannerItemToHighLevel
      tags: [planner-items]
      summary: Push planner item to HighLevel
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Push result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  # Templates
  /workspaces/{workspaceId}/templates:
    get:
      operationId: getTemplates
      tags: [templates]
      summary: List templates
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
    post:
      operationId: createTemplate
      tags: [templates]
      summary: Create template
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateBody"
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"

  /workspaces/{workspaceId}/templates/{id}:
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Get template
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
    delete:
      operationId: deleteTemplate
      tags: [templates]
      summary: Delete template
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /workspaces/{workspaceId}/templates/{id}/apply:
    post:
      operationId: applyTemplate
      tags: [templates]
      summary: Apply template to a month
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyTemplateBody"
      responses:
        "200":
          description: Applied items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlannerItem"

  # Dashboard / Analytics
  /workspaces/{workspaceId}/dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary metrics
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: string
          description: "YYYY-MM format"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /workspaces/{workspaceId}/dashboard/channel-breakdown:
    get:
      operationId: getChannelBreakdown
      tags: [dashboard]
      summary: Get per-channel item breakdown
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Channel breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelBreakdownItem"

  /workspaces/{workspaceId}/dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity/sync log
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLogEntry"

  /workspaces/{workspaceId}/dashboard/overdue:
    get:
      operationId: getOverdueItems
      tags: [dashboard]
      summary: Get overdue planner items
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Overdue items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlannerItem"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /webhooks:
    post:
      tags: [Auth]
      operationId: receiveWebhook
      summary: Receive a HighLevel webhook event
      responses:
        '200':
          description: Webhook received.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    GetCurrentAuthUserResponse:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    ExchangeMobileAuthorizationCodeBody:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    ExchangeMobileAuthorizationCodeResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    LogoutMobileSessionResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    WebhookAck:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DeleteResult:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    Workspace:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        industry:
          type: ["string", "null"]
        timezone:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - slug
        - timezone
        - createdAt
        - updatedAt

    CreateWorkspaceBody:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        industry:
          type: ["string", "null"]
        timezone:
          type: string
      required:
        - name
        - slug
        - timezone

    UpdateWorkspaceBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        industry:
          type: ["string", "null"]
        timezone:
          type: string

    Integration:
      type: object
      properties:
        id:
          type: integer
        workspaceId:
          type: integer
        provider:
          type: string
        authType:
          type: string
        locationId:
          type: ["string", "null"]
        tokenLastFour:
          type: ["string", "null"]
        scopes:
          type: ["string", "null"]
        status:
          type: string
          enum: [connected, disconnected, token_invalid, missing_scope, sync_delayed]
        lastValidatedAt:
          type: ["string", "null"]
        lastSyncedAt:
          type: ["string", "null"]
        tokenRotationDueAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - workspaceId
        - provider
        - authType
        - status
        - createdAt
        - updatedAt

    CreateIntegrationBody:
      type: object
      properties:
        provider:
          type: string
        authType:
          type: string
        token:
          type: string
        locationId:
          type: string
        scopes:
          type: ["string", "null"]
      required:
